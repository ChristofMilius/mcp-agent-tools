name: Bump submodules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-submodules
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance every submodule to its master tip
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --remote --recursive

      - name: Detect movement
        id: moved
        run: |
          if git diff --quiet --ignore-submodules=none; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Every submodule already matches its master tip."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --submodule=short
          fi

      - name: Open or update the bump pull request
        if: steps.moved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bump/submodules-to-master"
          summary="$(git diff --submodule=short)"
          {
            echo "Automated bump of the submodule pointers to each tool's master tip."
            echo
            echo '```'
            echo "$summary"
            echo '```'
            echo
            echo "Opened by the scheduled Bump submodules workflow. Merge to make the"
            echo "coordinator reflect these commits."
          } > "$RUNNER_TEMP/body.md"
          git checkout -B "$branch"
          git add -A
          git commit -m "stack: bump tools to their master tip"
          git push --force origin "HEAD:refs/heads/$branch"
          if gh pr view "$branch" --json number --jq .number >/dev/null 2>&1; then
            echo "Refreshed the open bump pull request for $branch."
          else
            gh pr create --base master --head "$branch" \
              --title "stack: bump tools to their master tip" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
